# Nightly cross-platform build of SFS Super.
#
# Publishes a SEPARATE plugin (slug "SFSSuper-nightly", name "SFS Super (Nightly)")
# so it can later install alongside a VCV Library build without a slug collision.
# Every module is un-hidden. Artifacts (mac arm64/x64, win x64, lin x64) are
# attached to a rolling "nightly" prerelease. Each platform builds natively on
# its own GitHub runner (mac x64 is cross-compiled on the arm64 runner). Adapted
# from Signal Function Set's nightly workflow.

name: Nightly

on:
  push:
    branches: [main]        # runs only when there's a new commit
  workflow_dispatch:          # manual "Run workflow" button

concurrency:
  group: nightly              # a newer push cancels an in-flight nightly
  cancel-in-progress: true

env:
  RACK_SDK_VERSION: "2.6.4"

jobs:

  # ── Derive the build identity ONCE ─────────────────────────────────────────
  # It used to be computed inline in every job that needed it: three copies that
  # had to agree, and the Windows one could not work at all, because its msys2
  # shell has no git on PATH (`git rev-parse` there is exit 127). Deriving it
  # once on ubuntu and passing it down removes both problems.
  stamp:
    name: Build stamp
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.s.outputs.date }}
      sha: ${{ steps.s.outputs.sha }}
      version: ${{ steps.s.outputs.version }}
      wip: ${{ steps.s.outputs.wip }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        # Checked, not merely captured: git returning nothing still exits 0, so
        # an unchecked stamp would read "2.16.3-nightly..abc1234" and SHIP it. A
        # malformed version reaching people is worse than a failed build.
        run: |
          set -e
          DATE=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)
          SHA=$(git rev-parse --short=7 HEAD)
          case "$DATE" in [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "::error::bad build date '$DATE'"; exit 1 ;; esac
          [ -n "$SHA" ] || { echo "::error::empty commit sha"; exit 1; }
          # The WIP list is READ from plugin.json, never written out here. As a
          # hand-kept sentence it drifted -- it named Wave and Ratio and then
          # never grew, so six later hidden modules went unmentioned.
          WIP=$(jq -r '[.modules[] | select(.hidden) | .name] | join(", ")' plugin.json)
          [ -n "$WIP" ] || WIP="none"
          {
            echo "date=$DATE"
            echo "sha=$SHA"
            echo "version=$(jq -r .version plugin.json)-nightly.$DATE.$SHA"
            echo "wip=$WIP"
          } >> "$GITHUB_OUTPUT"
          echo "stamp: -nightly.$DATE.$SHA"
          echo "wip:   $WIP"

  # ── Unix platforms: mac-arm64, mac-x64, lin-x64 — plain bash ────────────────
  build-unix:
    name: Build ${{ matrix.sdk }}
    needs: stamp
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14,      sdk: mac-arm64 }
          # mac-x64 is cross-compiled on the (plentiful) Apple-Silicon runner via
          # clang --target — macos-13 Intel runners are scarce and queue forever.
          - { runner: macos-14,      sdk: mac-x64, cross: x86_64-apple-darwin }
          - { runner: ubuntu-latest, sdk: lin-x64   }
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd jq

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd jq

      - name: Download Rack SDK
        run: |
          curl -fL -o rack-sdk.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q rack-sdk.zip
          echo "RACK_DIR=$PWD/Rack-SDK" >> "$GITHUB_ENV"

      - name: Stamp nightly identity + un-hide WIP modules
        run: |
          jq '
            .slug    += "-nightly"
            | .name  += " (Nightly)"
            | (if .brand then .brand += " Nightly" else . end)
            | .version += $stamp
            | .modules |= map(if .hidden then .hidden = false else . end)
          ' --arg stamp "-nightly.${{ needs.stamp.outputs.date }}.${{ needs.stamp.outputs.sha }}" \
            plugin.json > plugin.json.tmp && mv plugin.json.tmp plugin.json
          echo "--- nightly identity ---"
          jq '{slug, name, version}' plugin.json

      - name: Build
        run: |
          make clean
          # Only export CROSS_COMPILE when set — an empty value still trips the
          # SDK's `ifdef CROSS_COMPILE` and breaks native arch detection.
          if [ -n "${{ matrix.cross }}" ]; then export CROSS_COMPILE="${{ matrix.cross }}"; fi
          make -j"$(getconf _NPROCESSORS_ONLN)" dist
          echo "Built:"; ls -la dist/*.vcvplugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.sdk }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  # ── Windows: native MinGW64 via MSYS2 ───────────────────────────────────────
  build-win:
    name: Build win-x64
    needs: stamp
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            curl make tar zip unzip zstd
            mingw-w64-x86_64-gcc
            jq

      - name: Download Rack SDK
        run: |
          curl -fL -o rack-sdk.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip"
          unzip -q rack-sdk.zip
          echo "RACK_DIR=$PWD/Rack-SDK" >> "$GITHUB_ENV"

      - name: Stamp nightly identity + un-hide WIP modules
        run: |
          jq '
            .slug    += "-nightly"
            | .name  += " (Nightly)"
            | (if .brand then .brand += " Nightly" else . end)
            | .version += $stamp
            | .modules |= map(if .hidden then .hidden = false else . end)
          ' --arg stamp "-nightly.${{ needs.stamp.outputs.date }}.${{ needs.stamp.outputs.sha }}" \
            plugin.json > plugin.json.tmp && mv plugin.json.tmp plugin.json
          jq '{slug, name, version}' plugin.json

      - name: Build
        # Force libgcc + winpthread static so the .dll is self-contained (Rack on
        # Windows ships neither libgcc_s_seh-1.dll nor libwinpthread-1.dll). Mirrors
        # build.sh's native-Windows path.
        run: |
          make clean
          EXTRA_LDFLAGS='-static-libgcc -Wl,--whole-archive,-l:libwinpthread.a,--no-whole-archive' \
            make -j"$(nproc)" dist
          echo "Built:"; ls -la dist/*.vcvplugin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-win-x64
          path: dist/*.vcvplugin
          if-no-files-found: error

  # ── Collect, publish rolling prerelease ─────────────────────
  release:
    name: Publish nightly
    needs: [stamp, build-unix, build-win]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to update the rolling "nightly" release
    env:
      ALL_OK: ${{ needs.stamp.result == 'success' && needs.build-unix.result == 'success' && needs.build-win.result == 'success' }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Download all artifacts
        if: env.ALL_OK == 'true'
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: nightly-*
          merge-multiple: true

      - name: Clear the previous nightly's assets
        if: env.ALL_OK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The rolling release holds ONE build. While every filename was the flat
        # "-nightly" they overwrote each other and this was unnecessary; now that
        # each carries its date and commit they would pile up instead -- and a
        # release labelled "nightly" would be handing out stale commits next to
        # the current one, with nothing but the filename to tell them apart.
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r a; do
                [ -n "$a" ] || continue
                echo "removing stale asset $a"
                gh release delete-asset nightly "$a" --yes || true
              done

      - name: Publish rolling nightly prerelease
        if: env.ALL_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          files: out/*.vcvplugin
          body: |
            **Automated nightly build** of SFS Super, rebuilt on every commit to `main`.

            The Super Synthesis Eurorack library (Chris McDowell, CC0) ported to VCV Rack. An unofficial port, not endorsed by Super Synthesis.

            - Version `${{ needs.stamp.outputs.version }}`, commit `${{ needs.stamp.outputs.sha }}`
            - Modules (all work in progress): ${{ needs.stamp.outputs.wip }}
            - Platforms: mac arm64, mac x64, Windows x64, Linux x64.

            To install, drop the `.vcvplugin` for your platform into Rack's plugins folder (`Rack2/plugins-<platform>/`) and restart Rack. The plugin shows as *SFS Super (Nightly)*, slug `SFSSuper-nightly`. Unsigned, so macOS may warn on first load.
